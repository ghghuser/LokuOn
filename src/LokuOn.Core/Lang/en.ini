info.help.body=- Input devices: 🎤 = microphone, 🔊 = speaker sound (PC internal audio). ＊ = the Windows default device.\n- Recording: ● Start recording → ■ Stop to save. ❚❚ Pause and ✂ Split are also available.\n- File name: built from the template variables {Date} {Time} {No} {Track} {Start} {End} {Length} and others.\n- Settings are saved in settings.ini next to LokuOn.exe; presets are saved as "name.json" in the Presets folder.\n- Backup: use "Back up settings (ZIP)". To restore, quit LokuOn, extract the ZIP, and copy settings.ini and Presets over the ones next to LokuOn.exe.\n- Troubleshooting: check lokuon-crash.log and lokuon.log in the same folder.
