; LokuOn UI text (English). UTF-8, "key=text". Lines starting with ; are comments.
; \n = line break, \\ = backslash. {0} {1} are filled in at run time (keep their count and order).
; Keys missing here fall back to the Japanese text (ja.ini). This file is embedded in the exe;
; a Lang\en.ini next to the exe overrides single keys (write only the keys you want to change).
; Style: short, plain labels; no "please".

