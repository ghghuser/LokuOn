; LokuOn 画面の文言(日本語)。UTF-8。「キー=文」。; で始まる行はコメント。
; 改行は \n、バックスラッシュは \\ 。{0} {1} は実行時に値が入る場所(個数・順番はそのまま維持)。
; このファイルは exe に埋め込み済み。exe と同じ場所の Lang\ja.ini があれば、そちらの文言を優先する(直したいキーだけ書けばよい)。
; 文体: 体言止め中心(話し言葉・命令文を避ける)。

