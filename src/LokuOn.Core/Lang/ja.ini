info.help.body=・入力デバイス: 🎤=マイク、🔊=スピーカーの音(PC内部音)。＊=Windows の既定のデバイス。\n・録音: ●録音開始 → ■停止で保存。❚❚一時停止・✂分割も可。\n・ファイル名: テンプレートの変数 {Date} {Time} {No} {Track} {Start} {End} {Length} などで決定。\n・設定は LokuOn.exe と同じフォルダの settings.ini、プリセットは Presets フォルダの「名前.json」に保存。\n・バックアップ: 「設定をバックアップ(ZIP)」で保存。復元は、LokuOn の終了後に ZIP を展開し、settings.ini と Presets を LokuOn.exe と同じフォルダへ上書きコピー。\n・困ったとき: 同じフォルダの lokuon-crash.log と lokuon.log を確認。
