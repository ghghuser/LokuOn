; ===== 小さなウィンドウ類(段階2)。キーは 出力=out / 出力FX=outfx / 入力FX=fx / 変数=var / ホットキー=hotkey + 通し番号。同じ文言は先に出たキーを共用 =====
[windows]
; --- 出力ウィンドウ(OutputWindow)
out.01=＋ 出力を追加
out.02=出力なし。「＋ 出力を追加」から開始。
out.03=LokuOn - 出力
out.04=入力の音を、再生デバイス(スピーカー・ヘッドホン・VB-CABLEのCABLE Inputなど)へ出力。録音とは独立していて、このウィンドウを閉じても出力は止まらない。入力として取り込み中のデバイスは選択不可。
out.05=読み込み中…\n出力デバイスを確認中。
out.06=名前(自由に変更可)
out.07=この出力を削除
out.08=この出力のエフェクト(ローカット・EQ・リミッター)
out.09=出力する
out.10=この出力の全体音量(ダブルクリックで0dB)
out.11=入力デバイスが未選択(メイン画面で選択)
out.12=\n(ダブルクリックで名前を変更)
out.13=この入力をこの出力へ送る音量(ダブルクリックで0dB)
out.14=入力 {0}/{1} を送信中
out.15=入力(送る入力にチェック {0}/{1})
out.16=(未選択)
out.17=  (入力と同じため選択不可)
