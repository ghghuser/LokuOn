name: Build LokuOn

# 使い方:
#  ・main ブランチへアップロード(push)すると自動でビルドされ、Actions の「Artifacts」から ZIP を取得できます。
#  ・Releases に公開したいときは、タグ(例: v1.0.0)を付けて push するか、
#    Actions タブ → 「Build LokuOn」→ Run workflow を実行してください。
on:
  push:
    branches: [ main, master ]
    # 文書だけの変更ではビルドしない(成果物の入れ替わりと実行時間の節約)。タグ(v*)の push には適用されない。
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '**.txt'
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write     # 古い成果物の削除に必要

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: .NET 9 をセットアップ
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: FFmpeg を取得(LGPL版。一時的な失敗は再試行 → だめなら次の候補 → 最後の手段でGPL版)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path ffmpeg-dl | Out-Null
          # 候補の順番: ① 安定版(n8.1)のLGPL ② 開発版(master)のLGPL ③ gyan.dev のGPL版(LGPLが取れないときだけの最後の手段)
          # ①のファイル名は新しい版に切り替わると 404 になるので、②が控えている。
          $urls = @(
            'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-lgpl-8.1.zip',
            'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip',
            'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip'
          )
          # アプリが使う形式 → エンコーダー名と拡張子
          $codecs = @(
            @('libmp3lame', 'mp3'), @('aac', 'm4a'), @('flac', 'flac'), @('libvorbis', 'ogg'), @('libopus', 'opus'), @('pcm_s16le', 'wav')
          )
          # 実際にエンコードできるかの確認用に、0.2秒ぶんの無音(48kHz/16bit/ステレオ)を用意する
          $raw = Join-Path (Get-Location) 'ffmpeg-dl/silence.raw'
          [IO.File]::WriteAllBytes($raw, (New-Object byte[] (48000 * 4 / 5)))

          $ok = $false
          foreach ($u in $urls) {
            try {
              # 一時的な 502/503 などに備えて、同じURLを最大3回(待ち時間を伸ばしながら)試す。404 などは再試行しても同じなので次の候補へ
              $got = $false
              for ($i = 1; $i -le 3 -and -not $got; $i++) {
                try {
                  Write-Host "ダウンロード($i/3): $u"
                  Invoke-WebRequest -Uri $u -OutFile ffmpeg-dl/ffmpeg.zip -UseBasicParsing
                  $got = $true
                } catch {
                  $code = $null
                  if ($_.Exception.Response) { $code = [int]$_.Exception.Response.StatusCode }
                  Write-Host "  失敗: $($_.Exception.Message)"
                  if ($code -ge 400 -and $code -lt 500 -and $code -ne 429) { throw }
                  if ($i -lt 3) { Start-Sleep -Seconds (10 * $i) } else { throw }
                }
              }
              Remove-Item -Recurse -Force ffmpeg-dl/x -ErrorAction SilentlyContinue
              Expand-Archive ffmpeg-dl/ffmpeg.zip -DestinationPath ffmpeg-dl/x -Force
              $exe = Get-ChildItem ffmpeg-dl/x -Recurse -Filter ffmpeg.exe | Select-Object -First 1
              if (-not $exe) { throw 'ffmpeg.exe が見つかりません' }

              # 検査1: エンコーダー一覧に、音声(A)のエンコーダーとして載っているか(説明文の中の同じ文字には反応しない)
              $enc = & $exe.FullName -hide_banner -encoders 2>&1 | Out-String
              $missing = @($codecs | Where-Object { $enc -notmatch ('(?m)^\s*A\S*\s+' + [regex]::Escape($_[0]) + '\s') } | ForEach-Object { $_[0] })
              if ($missing.Count -gt 0) { throw "必要なエンコーダーがありません: $($missing -join ', ')" }

              # 検査2: 実際にその形式で書き出せるか(アプリと同じ、生のPCMを読み込んで書き出す)
              foreach ($c in $codecs) {
                $out = Join-Path (Get-Location) "ffmpeg-dl/check.$($c[1])"
                Remove-Item $out -ErrorAction SilentlyContinue
                & $exe.FullName -hide_banner -loglevel error -y -f s16le -ar 48000 -ac 2 -i $raw -c:a $c[0] $out
                if ($LASTEXITCODE -ne 0 -or -not (Test-Path $out) -or (Get-Item $out).Length -le 0) { throw "エンコード確認に失敗: $($c[0]) (.$($c[1]))" }
              }

              New-Item -ItemType Directory -Force -Path ffmpeg-dl/bin | Out-Null
              Copy-Item $exe.FullName ffmpeg-dl/bin/ffmpeg.exe -Force
              if ($u -like '*gyan.dev*') { Write-Host '::warning::LGPL版を取得できなかったため、GPL版の FFmpeg を同梱します'; }
              $ok = $true
              break
            } catch {
              Write-Host "この候補は使えません: $($_.Exception.Message)"
            }
          }
          if (-not $ok) { throw 'FFmpeg を用意できませんでした' }
          & ffmpeg-dl/bin/ffmpeg.exe -version | Select-Object -First 2

      - name: コアの自己テスト(録音・分割・命名・復旧など)
        shell: pwsh
        continue-on-error: true
        run: |
          $env:PATH = "$((Resolve-Path ffmpeg-dl/bin).Path);$env:PATH"
          dotnet run --project tests/LokuOn.SelfTest -c Release

      - name: 発行(インストール不要・単一exe)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish src/LokuOn.App/LokuOn.App.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none -p:DebugSymbols=false -o publish-tmp
          # 配布フォルダには LokuOn.exe と ffmpeg だけを置く(設定ファイルは初回起動時に自動で作られる)
          New-Item -ItemType Directory -Force -Path publish/LokuOn/ffmpeg | Out-Null
          Copy-Item publish-tmp/LokuOn.exe publish/LokuOn/LokuOn.exe -Force
          Copy-Item ffmpeg-dl/bin/ffmpeg.exe publish/LokuOn/ffmpeg/ffmpeg.exe -Force
          Write-Host '--- 配布フォルダの中身 ---'
          Get-ChildItem publish -Recurse -File | ForEach-Object { '{0}  {1:N1} MB' -f $_.FullName.Substring((Get-Location).Path.Length + 1), ($_.Length / 1MB) }

      # ZIP は Releases に公開するときだけ使うので、タグ(v*)のときだけ作る(通常のビルドは時間を節約)
      - name: ZIP を作成(ZIPの中は LokuOn\LokuOn.exe)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Compress-Archive -Path publish/LokuOn -DestinationPath LokuOn-win-x64.zip -Force
          (Get-Item LokuOn-win-x64.zip).Length

      # Artifacts は自動でZIPにされるため、ZIPを入れると二重になる。
      # 「publish」フォルダごと渡すと、ダウンロードした LokuOn-win-x64.zip の中が LokuOn\LokuOn.exe になる。
      - name: Artifacts にアップロード
        uses: actions/upload-artifact@v4
        with:
          name: LokuOn-win-x64
          path: publish
          if-no-files-found: error

      # 保存容量の上限に達しないよう、アップロードが成功したあとで古い成果物を消し、直近2件だけ残す。
      # 失敗しても(権限・通信など)ビルド自体は成功のままにする。名前が違う成果物には触らない。
      - name: 古い成果物を整理(直近2件だけ残す)
        if: success()
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $keep = 2
          $repo = '${{ github.repository }}'
          $json = gh api "repos/$repo/actions/artifacts?name=LokuOn-win-x64&per_page=100" | ConvertFrom-Json
          $all = @($json.artifacts | Where-Object { -not $_.expired } | Sort-Object { [datetime]$_.created_at } -Descending)
          Write-Host "成果物 $($all.Count) 件(残す: $keep 件)"
          foreach ($a in ($all | Select-Object -Skip $keep)) {
            gh api -X DELETE "repos/$repo/actions/artifacts/$($a.id)" | Out-Null
            Write-Host "削除: $($a.id)  $($a.created_at)  $($a.workflow_run.head_sha.Substring(0,7))"
          }

      - name: Releases に公開(タグ v* のとき)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LokuOn-win-x64.zip
          generate_release_notes: true
